name: Extension CI

on:
  push:
    branches:
      - main
    tags:
      - "releases/**"
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      node-version: 22.x # See Node.js release schedule: https://nodejs.org/en/about/releases/
    outputs:
      new_tag: ${{ steps.find_version.outputs.new_tag }} # Tag includes `v` prefix. ie: v1.2.3
      new_version: ${{ steps.find_version.outputs.new_version }} # Version has no prefix. ie: 1.2.3
      changelog: ${{ steps.find_version.outputs.changelog }}
      vsixPath: ${{ steps.package.outputs.vsixPath }}

    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Setup Node v${{ env.node-version }}
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: ${{ env.node-version }}
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      - name: Fetch next version
        uses: mathieudutour/github-tag-action@aacd18f07c808c12edb372dc9f9e7160f06c72e8 # v6.1
        id: find_version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          dry_run: true

      - run: yarn run lint

      - run: yarn run check-types

      # - name: yarn run test
      #   uses: GabrielBB/xvfb-action@fe2609f8182a9ed5aee7d53ff3ed04098a904df2 # v1.0
      #   with:
      #     run: yarn run test

      - name: Set package.json version to ${{ steps.find_version.outputs.new_version }}
        run: >
          cp package.json tmp.json;
          jq -r '.version |= "${{ steps.find_version.outputs.new_version }}"' tmp.json > package.json;
          rm -rf tmp.json

      - name: Package as `flagpole-explorer-${{ steps.find_version.outputs.new_version }}.vsix`
        id: package
        uses: HaaLeo/publish-vscode-extension@4004fc217b5ac892b15a1c3cbe6458de97242dde # v2
        with:
          pat: FAKE_FOR_PACKAGE
          dryRun: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          RELEASE: ${{ steps.find_version.outputs.new_version }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 4.6.2
        with:
          path: ${{ steps.package.outputs.vsixPath }}

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases/')
    runs-on: ubuntu-latest
    env:
      node-version: 22.x # See Node.js release schedule: https://nodejs.org/en/about/releases/

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # 5.0.0
        with:
          path: ./

      - name: Sentry Release ${{ needs.build.outputs.new_version }}
        uses: getsentry/action-release@dab6548b3c03c4717878099e43782cf5be654289 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          release: ${{ needs.build.outputs.new_version }}
          ignore_missing: true
          finalize: true
          set_commits: skip

      - name: Create GitHub release tag ${{ needs.build.outputs.new_tag }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.build.outputs.new_tag }}
          name: Release ${{ needs.build.outputs.new_tag }}
          body: ${{ needs.build.outputs.changelog }}
          artifacts: ${{ needs.build.outputs.vsixPath }}

      - name: Publish ${{ needs.build.outputs.new_version }} to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@4004fc217b5ac892b15a1c3cbe6458de97242dde # v2
        with:
          pat: ${{ secrets.OVSX_REGISTRY_TOKEN }}
          extensionFile: ${{ needs.build.outputs.vsixPath }}

      - name: Publish ${{ needs.build.outputs.new_version }} to VSCode Marketplace
        uses: HaaLeo/publish-vscode-extension@4004fc217b5ac892b15a1c3cbe6458de97242dde # v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          extensionFile: ${{ needs.build.outputs.vsixPath }}
          registryUrl: https://marketplace.visualstudio.com
